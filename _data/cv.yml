        location: Zurich, Switzerland
        start_date: 2025-09-15
        end_date: present
        highlights:
          - Research on spatio-temporal motion retargeting (STMR) and whole-body control for humanoids.
          - Integrating sampling-based MPC and MPPI methods using GPU-parallelized physics simulation (MuJoCo) for kino-dynamically feasible motion generation from keypoint trajectories.

      - company: ETH Computational Robotics Lab
        position: University Research Assistant
        location: Zurich, Switzerland
        start_date: 2024-02-14
        end_date: 2025-02-14
        summary: Diversifying gait patterns using unsupervised skill discovery, and RL-based multi-gait locomotion for an interactive media art exhibition.
        highlights:
          - Implemented unsupervised skill discovery methods with discrete latent variables (inspired by DIAYN & DISDAIN) and continuous latent variables (ASE, METRA) to encode skills into a latent space for control.
          - Trained a policy that allows for controlling height, gait patterns, pitch angle, and feet width in quadruped locomotion.
          - Developed and deployed a reinforcement learning-based locomotion controller producing expressive gait patterns, used live in the AATB artistic studio's exhibition.
          - Gained experience with IsaacLab, Python, ROS2, and reinforcement learning.

      - company: KAIST Humanoid Generalization Lab
        position: University Research Assistant
        location: Seoul, South Korea
        start_date: 2023-06-09
        end_date: 2023-08-28
        highlights:
          - Designed a hierarchical MCTS algorithm that conducts MCTS search in hierarchy.
          - Implemented the algorithm and applied it to a simple toy domain, a maze domain, and a task and motion planning domain.

      - company: KAIST Programming Language Research Group
        position: University Research Assistant
        location: Daejeon, South Korea
        start_date: 2021-12-20
        end_date: 2023-06-14
        highlights:
          - Conducted research on "JavaScript and Test262 improvements and engine bug detection using automatically generated test cases" as part of the Undergraduate Research Program (URP).
          - Developed code to automatically test JavaScript engines with Test262 test cases using Scala and check whether failing cases are covered by the Feature Sensitivity Coverage standard in Test262.
          - Gained experience with Rust, Scala, Java, and OCaml.

    Projects:
      - name: Real-to-Sim 6-DoF Object Pose Estimation
        start_date: 2026
        end_date: 2026
        url: https://hudela390.github.io/real2sim-6dpose/
        summary: 3D Vision course project at ETH Zurich (Spring 2026) — 6-DoF object pose estimation from a single egocentric RGB video stream, without a depth sensor.
        highlights:
          - Tracked object pose through a full manipulation sequence (grasping, carrying, dropping) by combining object segmentation, monocular depth estimation, in-hand tracking with gripper kinematics constraints, and post-release 6D refinement.
          - Generated simulation-ready trajectories for replay in Isaac Sim.

      - name: Visual Odometry
        start_date: 2025-09-15
        end_date: 2026-01-05
        url: https://github.com/nicolejrkim/va25_project
        summary: Monocular visual odometry pipeline for real-time camera pose estimation.
        highlights:
          - Built a pipeline using KLT feature tracking, PnP-based localization, and landmark triangulation.
          - Enhanced the baseline with Local Bundle Adjustment, ground plane scale correction using SAM3 segmentation, and Sim(3)-based loop detection and closure, evaluated on the KITTI dataset.

      - name: DCASE 2020 Task 2
        start_date: 2025-03-02
        end_date: 2025-06-10
        url: https://github.com/nicolejrkim/ee488_DCASE2020-Task2
        summary: Anomalous machine sound detection with unsupervised learning for condition monitoring.
        highlights:
          - Implemented advanced architectures (e.g., NoisyArcMix, SpecNet) and applied feature normalization and model ensembling, improving AUC by 2.14%.

